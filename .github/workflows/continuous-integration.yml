name: "Continuous Integration"

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Coding standard
            command: composer cs-check
          - name: Static analysis
            command: composer analyze
          - name: Unit tests
            command: composer test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: ctype, iconv, imap, intl, mbstring
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run integration tests
        run: docker compose run --rm tests

      - name: Show GreenMail logs
        if: failure()
        run: docker compose logs greenmail

      - name: Tear down
        if: always()
        run: docker compose down --volumes

  dependabot-automerge:
    name: Dependabot automerge
    runs-on: ubuntu-latest
    needs:
      - checks
      - integration
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge pull request
        run: gh pr merge --merge --match-head-commit "$HEAD_SHA" --repo "$GITHUB_REPOSITORY" "$PR_NUMBER"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

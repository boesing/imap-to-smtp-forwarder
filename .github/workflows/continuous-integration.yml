# Only runs when something changed which is relevant for the checks, the image or the integration tests. Don't mark
# any of the jobs as required status check, as they do not report anything when the workflow is skipped.
name: "Continuous Integration"
on:
  pull_request:
    paths: &paths
      - src/**
      - tests/**
      - bin/**
      - docker/**
      - Dockerfile
      - compose.yml
      - compose.ci.yml
      - composer.json
      - composer.lock
      - phpcs.xml.dist
      - phpunit.xml.dist
      - psalm.xml.dist
      - .github/workflows/**
      - "!.github/workflows/publish-image.yml"
      - "!.github/workflows/composer-diff.yml"
      - "!.github/workflows/renovate-config-validator.yml"
  push:
    branches:
      - main
    paths: *paths
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    env:
      PHP_VERSION: "8.5"
      PHP_EXTENSIONS: ctype, iconv, imap, intl, mbstring
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Coding standard
            command: composer cs-check
          - name: Static analysis
            command: composer analyze
          - name: Unit tests
            command: composer test
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup extension cache
        id: extcache
        uses: shivammathur/cache-extensions@v1
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          key: php-extensions-v1
      - name: Cache extensions
        uses: actions/cache@v6
        with:
          path: ${{ steps.extcache.outputs.dir }}
          key: ${{ steps.extcache.outputs.key }}
          restore-keys: ${{ steps.extcache.outputs.key }}
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --no-progress
      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}
  # The image of a pull request is downloadable as artifact `image-pr-<number>` (`docker load --input image.tar`).
  build:
    name: Build image
    uses: ./.github/workflows/build-image.yml
    with:
      artifact-name: ${{ github.event_name == 'pull_request' && format('image-pr-{0}', github.event.pull_request.number) || 'image' }}
      retention-days: ${{ github.event_name == 'pull_request' && 7 || 1 }}
  integration:
    name: Integration tests
    needs: build
    uses: ./.github/workflows/integration-tests.yml
    with:
      image-artifact: ${{ github.event_name == 'pull_request' && format('image-pr-{0}', github.event.pull_request.number) || 'image' }}
  dependabot-automerge:
    name: Dependabot automerge
    runs-on: ubuntu-latest
    needs:
      - checks
      - integration
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge pull request
        run: gh pr merge --merge --match-head-commit "$HEAD_SHA" --repo "$GITHUB_REPOSITORY" "$PR_NUMBER"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

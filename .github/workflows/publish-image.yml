name: "Publish Image"

on:
  # Daily check on main (UTC), a release is only created when image relevant files changed since the last one.
  schedule:
    - cron: "0 18 * * *"
  pull_request:
    paths:
      - Dockerfile
      - bin/**
      - src/**
      - composer.json
      - composer.lock
      - .github/workflows/publish-image.yml
  workflow_dispatch:

permissions:
  contents: read

# Releases must not be cancelled half-way and must not run in parallel, as the version counter reads existing tags.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.ref) || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Releases are only created when image relevant files changed since the last release (also for manual runs).
  changes:
    name: Check for image changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compare with last release
        id: diff
        run: |
          # Reuse the paths of the pull_request trigger.
          mapfile -t paths < <(yq '.on.pull_request.paths[] | ":(glob)" + .' .github/workflows/publish-image.yml)
          last="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -z "$last" ] || ! git diff --quiet "$last" HEAD -- "${paths[@]}"; then
            changed=true
          else
            changed=false
          fi

          echo "changed=${changed}" >> "$GITHUB_OUTPUT"
          {
            echo "Last release: ${last:-none}"
            echo "Checked paths: ${paths[*]}"
            echo "Release needed: ${changed}"
          } >> "$GITHUB_STEP_SUMMARY"

  # Builds the image exactly once. The very same image is tested by the integration job and pushed by the publish job.
  build:
    name: Build image
    needs: changes
    if: needs.changes.outputs.changed == 'true' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Determine calendar version
        id: version
        run: |
          today="$(date -u +%Y.%m.%d)"
          existing="$(git ls-remote --tags --refs origin "refs/tags/${today}*" | wc -l | tr -d ' ')"
          if [ "$existing" -eq 0 ]; then
            echo "version=${today}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${today}.${existing}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=pr
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.event_name != 'pull_request' }}
            type=raw,value={{date 'YYYY.MM'}},enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          push: false
          # The tag is the one compose.yml expects for the forwarder service of the integration tests.
          tags: imap-to-smtp-forwarder:integration
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload image
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event_name == 'pull_request' && format('image-pr-{0}', github.event.pull_request.number) || 'image' }}
          path: ${{ runner.temp }}/image.tar
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 1 }}

  # Gate for the release, pull requests already run the integration tests in the continuous integration workflow.
  integration:
    name: Integration tests
    needs: build
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/integration-tests.yml
    with:
      image-artifact: image

  publish:
    name: Push image and create release
    needs:
      - build
      - integration
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Download image
        uses: actions/download-artifact@v8
        with:
          name: image
          path: ${{ runner.temp }}

      - name: Load image
        run: docker load --input "${RUNNER_TEMP}/image.tar"

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: |
          while read -r tag; do
            docker tag imap-to-smtp-forwarder:integration "$tag"
            docker push "$tag"
          done <<< "$TAGS"
        env:
          TAGS: ${{ needs.build.outputs.tags }}

      - name: Create release
        run: gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
        env:
          VERSION: ${{ needs.build.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

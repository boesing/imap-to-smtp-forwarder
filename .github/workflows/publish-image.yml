name: "Publish Image"

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - bin/**
      - src/**
      - composer.json
      - composer.lock
      - .github/workflows/publish-image.yml
  pull_request:
    paths:
      - Dockerfile
      - bin/**
      - src/**
      - composer.json
      - composer.lock
      - .github/workflows/publish-image.yml

permissions:
  contents: read

# Releases must not be cancelled half-way, otherwise a merge would never be published.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: Build${{ github.event_name != 'pull_request' && ' and push' || '' }} image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine calendar version
        id: version
        run: |
          today="$(date -u +%Y.%m.%d)"
          existing="$(git ls-remote --tags --refs origin "refs/tags/${today}*" | wc -l | tr -d ' ')"
          if [ "$existing" -eq 0 ]; then
            echo "version=${today}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${today}.${existing}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=pr
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.event_name != 'pull_request' }}
            type=raw,value={{date 'YYYY.MM'}},enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}

      - name: Build${{ github.event_name != 'pull_request' && ' and push' || '' }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: ${{ github.event_name != 'pull_request' }}
          outputs: ${{ github.event_name == 'pull_request' && format('type=docker,dest={0}/image.tar', runner.temp) || '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload image
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: image-pr-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/image.tar
          retention-days: 7

      - name: Create release
        if: github.event_name != 'pull_request'
        run: gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

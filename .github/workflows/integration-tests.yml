name: "Integration Tests"

on:
  workflow_call:
    inputs:
      image-artifact:
        description: Name of the artifact containing `image.tar` (see build-image.yml), which is the forwarder image under test.
        type: string
        required: true

permissions:
  contents: read

jobs:
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    env:
      # Same as in continuous-integration.yml.
      PHP_VERSION: "8.5"
      PHP_EXTENSIONS: ctype, iconv, imap, intl, mbstring
      # Only the forwarder (the image under test) and GreenMail run in containers. PHPUnit runs on the runner and reaches
      # GreenMail via the ports published by compose.ci.yml.
      COMPOSE_FILE: compose.yml:compose.ci.yml
      GREENMAIL_HOST: 127.0.0.1
      GREENMAIL_IMAP_FLAGS: /novalidate-cert
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download forwarder image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ inputs.image-artifact }}
          path: ${{ runner.temp }}

      - name: Load forwarder image
        run: docker load --input "${RUNNER_TEMP}/image.tar"

      - name: Setup extension cache
        id: extcache
        uses: shivammathur/cache-extensions@v1
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          key: php-extensions-v1

      - name: Cache extensions
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.extcache.outputs.dir }}
          key: ${{ steps.extcache.outputs.key }}
          restore-keys: ${{ steps.extcache.outputs.key }}

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      # Starts the forwarder and its dependencies (GreenMail, certificates), but not the `tests` service.
      - name: Start forwarder
        run: docker compose up --detach --wait forwarder

      - name: Run integration tests
        run: composer test-integration

      - name: Show forwarder and GreenMail logs
        if: failure()
        run: docker compose logs forwarder greenmail

      - name: Tear down
        if: always()
        run: docker compose down --volumes

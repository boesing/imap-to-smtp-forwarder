name: "Integration Tests"

on:
  workflow_call:
    inputs:
      image-artifact:
        description: Name of the artifact containing `image.tar` (see build-image.yml), which is the forwarder image under test.
        type: string
        required: true

permissions:
  contents: read

jobs:
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download forwarder image
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.image-artifact }}
          path: ${{ runner.temp }}

      - name: Load forwarder image
        run: docker load --input "${RUNNER_TEMP}/image.tar"

      - name: Run integration tests
        run: docker compose run --rm tests

      - name: Show forwarder and GreenMail logs
        if: failure()
        run: docker compose logs forwarder greenmail

      - name: Tear down
        if: always()
        run: docker compose down --volumes
